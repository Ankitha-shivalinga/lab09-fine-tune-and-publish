[project]
name = "lab09-fine-tune-and-publish"
version = "0.1.0"
description = "Lakeshore Ticket Sorter: fine-tuning DistilBERT against a baseline"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
